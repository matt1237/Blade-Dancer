<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
 <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef6f2"/><stop offset=".48" stop-color="#9bb0bb"/><stop offset="1" stop-color="#4c5d72"/></linearGradient>
 <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3d87bd"/><stop offset="1" stop-color="#173b70"/></linearGradient>
 <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9a6046"/><stop offset="1" stop-color="#4c2e32"/></linearGradient>
</defs>
